<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>彩票模拟开奖</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="./styles.css" />
</head>
<body>
    <div class="page-shell">
        <header class="hero">
            <h1>彩票模拟开奖</h1>
        </header>

        <main class="grid">
            <section class="section">
                <div class="flash" id="ssq-flash"></div>
                <div class="section-head">
                    <div>
                        <span class="eyebrow">福彩玩法</span>
                        <h2>双色球</h2>
                    </div>
                    <button id="btn-ssq" onclick="loadSSQ()">立即开奖</button>
                </div>
                <div class="result-panel">
                    <p id="ssq-status" class="status-text">点击按钮开始生成</p>
                    <div id="ssq-loader" class="loader"></div>
                    <div id="ssq-balls" class="balls"></div>
                </div>
            </section>

            <section class="section">
                <div class="flash" id="dlt-flash"></div>
                <div class="section-head">
                    <div>
                        <span class="eyebrow">体彩玩法</span>
                        <h2>大乐透</h2>
                    </div>
                    <button id="btn-dlt" onclick="loadDLT()">立即开奖</button>
                </div>
                <div class="result-panel">
                    <p id="dlt-status" class="status-text">点击按钮开始生成</p>
                    <div id="dlt-loader" class="loader"></div>
                    <div id="dlt-balls" class="balls"></div>
                </div>
            </section>
        </main>

        <footer class="footer">
            <p>博客: <a href="https://www.runnable.run/" target="_blank" rel="noreferrer">Asher 的博客</a> | 号码来源: <a href="https://996.ninja/" target="_blank" rel="noreferrer">996 Ninja</a></p>
        </footer>
    </div>
    <script src="./app.js"></script>
</body>
</html>
